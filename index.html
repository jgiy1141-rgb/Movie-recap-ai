<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie Recap AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: auto;
      padding: 30px 0 50px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .header p {
      color: #aeb7ca;
    }

    .card {
      background: #151c30;
      border: 1px solid #29334d;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin-top: 0;
    }

    .upload {
      border: 2px dashed #596681;
      border-radius: 15px;
      padding: 35px 15px;
      text-align: center;
      cursor: pointer;
    }

    .upload:hover {
      border-color: #8066ff;
    }

    .upload input {
      display: none;
    }

    .upload-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    #fileName {
      margin-top: 12px;
      color: #aeb7ca;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
      background: black;
      display: none;
    }

    .settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #cbd3e2;
    }

    select,
    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #39445f;
      background: #0d1425;
      color: white;
      font-size: 16px;
    }

    button {
      background: #7055ff;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #5c42e5;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #generateBtn {
      margin-top: 20px;
      font-size: 18px;
    }

    #progressBox {
      display: none;
      margin-top: 20px;
    }

    .progress {
      width: 100%;
      height: 12px;
      background: #080d19;
      border-radius: 20px;
      overflow: hidden;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: #8066ff;
      transition: width 0.3s;
    }

    #status {
      margin-top: 10px;
      color: #aeb7ca;
    }

    #results {
      display: none;
    }

    .result {
      background: #0d1425;
      border: 1px solid #29334d;
      border-radius: 12px;
      padding: 18px;
      margin-top: 12px;
    }

    .result p {
      color: #cbd3e2;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .download {
      margin-top: 10px;
      background: #202a42;
    }

    footer {
      text-align: center;
      color: #68738a;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .settings {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🎬 Movie Recap AI</h1>
    <p>Video ထည့်ပြီး AI Recap ပြုလုပ်ပါ</p>
  </div>


  <!-- VIDEO UPLOAD -->

  <div class="card">

    <h2>🎥 Video Upload</h2>

    <label class="upload">

      <div class="upload-icon">📁</div>

      <strong>Video ရွေးရန် နှိပ်ပါ</strong>

      <p>MP4 / MOV / WEBM</p>

      <input
        id="videoInput"
        type="file"
        accept="video/*"
      >

      <div id="fileName">
        Video မရွေးရသေးပါ
      </div>

    </label>

    <video id="videoPreview" controls></video>

  </div>


  <!-- SETTINGS -->

  <div class="card">

    <h2>⚙️ Recap Settings</h2>

    <div class="settings">

      <div>

        <label>ဘာသာစကား</label>

        <select id="language">

          <option value="my">
            မြန်မာ
          </option>

          <option value="en">
            English
          </option>

        </select>

      </div>


      <div>

        <label>Recap အရှည်</label>

        <select id="recapLength">

          <option value="short">
            Short
          </option>

          <option value="normal">
            Normal
          </option>

          <option value="long">
            Detailed
          </option>

        </select>

      </div>

    </div>


    <button id="generateBtn">
      🤖 Generate Recap
  </button>
    <div id="progressBox">
  <div class="progress">
    <div id="progressBar"></div>
  </div>
  <div id="status">အသင့်ဖြစ်ပါပြီ</div>
</div>

<div id="results">
  <div class="result">
    <p id="recapText"></p>
    <button class="download" onclick="downloadRecap()">
      ⬇️ Download Recap
    </button>
  </div>
</div>
    <script>const videoInput = document.getElementById("videoInput");
const videoPreview = document.getElementById("videoPreview");
const fileName = document.getElementById("fileName");

videoInput.addEventListener("change", function () {
  const file = videoInput.files[0];

  if (!file) return;

  fileName.textContent = file.name;

  videoPreview.src = URL.createObjectURL(file);
  videoPreview.style.display = "block";
});
      
    

const generateBtn = document.getElementById("generateBtn");
const status = document.getElementById("status");
const results = document.getElementById("results");
const recapText = document.getElementById("recapText");
      


  /* SHOW RECAP */

const generateBtn =
  document.getElementById("generateBtn");

const status =
  document.getElementById("status");

const results =
  document.getElementById("results");

const recapText =
  document.getElementById("recapText");


generateBtn.addEventListener(
  "click",
  showRecap
);


async function showRecap() {

  const video =
    document.getElementById("videoPreview");

  const videoFile =
    document.getElementById("videoInput").files[0];

  if (!videoFile) {
    status.textContent =
      "⚠️ Video အရင်ရွေးပါ";
    return;
  }

  try {

    generateBtn.disabled = true;

    results.style.display = "none";

    status.textContent =
      "🎬 Video ထဲက အသံကို ထုတ်နေပါတယ်...";


    /* VIDEO → AUDIO */

    const stream =
      video.captureStream();

    const audioTracks =
      stream.getAudioTracks();

    if (audioTracks.length === 0) {
      throw new Error(
        "ဒီ Video မှာ Audio track မတွေ့ပါ။"
      );
    }


    const audioStream =
      new MediaStream(audioTracks);


    const recorder =
      new MediaRecorder(
        audioStream,
        {
          mimeType: "audio/webm"
        }
      );


    const audioChunks = [];


    recorder.ondataavailable =
      function (event) {

        if (event.data.size > 0) {
          audioChunks.push(event.data);
        }

      };


    const audioBlobPromise =
      new Promise(
        (resolve) => {

          recorder.onstop =
            function () {

              const blob =
                new Blob(
                  audioChunks,
                  {
                    type: "audio/webm"
                  }
                );

              resolve(blob);

            };

        }
      );


    video.currentTime = 0;

    await video.play();

    recorder.start();


    video.onended =
      function () {

        if (
          recorder.state !== "inactive"
        ) {
          recorder.stop();
        }

      };


    const audioBlob =
      await audioBlobPromise;


    status.textContent =
      "🎙️ Whisper က အသံကို စာသားပြောင်းနေပါတယ်...";


    /* AUDIO → WHISPER */

    const formData =
      new FormData();

    formData.append(
      "audio",
      audioBlob,
      "movie-audio.webm"
    );


    const response =
      await fetch(
        "https://icy-credit-1319.jgiy1141.workers.dev/",
        {
          method: "POST",
          body: formData
        }
      );


    if (!response.ok) {
      throw new Error(
        "Whisper HTTP " +
        response.status
      );
    }


    const data =
      await response.json();


    /* WHISPER RESULT */

    const transcript =
      data.text ||
      data.transcription ||
      "";


    if (!transcript) {
      throw new Error(
        "Whisper က စာသားမထုတ်ပေးပါ။"
      );
    }


    recapText.textContent =
      transcript;

    results.style.display =
      "block";


    status.textContent =
      "✅ Video အသံကို စာသားအဖြစ် ရပါပြီ";


  } catch (error) {

    console.error(error);

    recapText.textContent =
      error.message;

    results.style.display =
      "block";

    status.textContent =
      "❌ Audio / Whisper Error";

  }


  generateBtn.disabled =
    false;

}
  function downloadRecap() {

    const text =
      recapText.textContent;

    const blob =
      new Blob(
        [text],
        {
          type: "text/plain;charset=utf-8"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");

    link.href = url;

    link.download =
      "movie-recap.txt";

    link.click();


    URL.revokeObjectURL(url);

  }
    
</script>

</body>
</html>
